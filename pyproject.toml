[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-code"
version = "0.1.0"
description = "Python skeleton for a DeepSeek-TUI port"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.112.0",
	"uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
	"pytest>=7.4.0",
	"pytest-asyncio>=0.23.0",
	"httpx>=0.27.0",
	"pytest-dotenv>=0.5.2"
]

[tool.pytest.ini_options]
markers = [
	"integration: live network tests that hit real APIs"
]
env_files = [
	".env.test"
]
log_cli = true
log_cli_level = "INFO"

[project.scripts]
ds-code = "ds_code.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
